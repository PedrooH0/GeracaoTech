<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    div { border: 1px solid red; }
    h2 { border: 1px solid blue; }
    p { border: 1px solid green; }
    span { border: 1px solid rgb(255, 0, 221); }
    .div1 { float: right; }
    .div3 { clear: right; }

  </style>
  <title>Document</title>
</head>
<body>
  
  <div class="div1">
    <h2>Usando o método float</h2>
    <p>teste</p>
    <span>teste</span>
  </div>

  <br>

  <div class="div2">
    <h2>Teste</h2>
  </div>

  <div class="div3">
    <h2>Teste do Clear</h2>
  </div>

  <br>

  <a href="./">Voltar</a>
</body>
</html>
