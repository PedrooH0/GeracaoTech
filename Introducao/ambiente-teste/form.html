<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles/style.css">
  <title>Formulário</title>
</head>
<body>
  

  <h1>Exemplos de input para formulários</h1>
  <form action="">
    <div>
      <label for="nome">Nome</label>
      <input required minlength="3" placeholder="Insira o seu nome" type="text" name="nome" id="nome">
    </div>

    <div>
      <label for="email">Email</label>
      <input required placeholder="Insira o seu email" type="email" name="email" id="email">
    </div>

    <div>
      <label for="senha">Senha</label>
      <input placeholder="Insira sua senha" type="password" name="senha" id="senha">
    </div>


    <div>
      <label for="checkbox"></label>
      <input type="checkbox" name="checkbox" id="checkbox">
    </div>

    <div>
      <label for="date">Data</label>
      <input type="date" name="date" id="date">
    </div>

    <div>
      <label for="date-time">Data e Hora</label>
      <input type="datetime" name="datetime" id="datetime">
    </div>

    <div>
      <label for="number">Número</label>
      <input type="number" name="number" id="number">
    </div>

    <div>
      <label for="color">Cor</label>
      <input type="color" name="color" id="color">
    </div>

    <div>
      <select name="Qualidade" id="">
        <option disabled selected value="">Insira um valor</option>
        <option value="Ótimo">Ótimo</option>
        <option value="Bom">Bom</option>
        <option value="Médio">Médio</option>
        <option value="Ruim">Ruim</option>
      </select>
    </div>

    <br>

    <input type="submit" value="Enviar">

  </form>

  <br>

  <a href="./">Voltar</a>
</body>
</html>
