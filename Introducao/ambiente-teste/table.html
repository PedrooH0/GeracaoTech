<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles/style.css">
  <title>Tabelas</title>
</head>
<body>
  
  <table border="1">
    <tr>
      <td>Pedro</td>
      <td>20</td>
    </tr>
  </table>

  <br>

  <table border="1">
    <caption>Tabela de pessoas</caption>
    <thead>
      <tr>
        <th>Nome</th>
        <th>Idade</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>Pedro</td>
        <td>20</td>
      </tr>
    </tbody>
  </table>

  <br>

  <a href="./">Voltar</a>
</body>
</html>
